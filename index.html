
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval API Test</title>
</head>
<body>

    <h3>Approval API Test</h3>

    <button id="checkBtn">Check Session</button>

    <pre id="result">Waiting...</pre>

    <script>
        const API_URL =
            "/api/v1/approvals/user-approvals/approve-reject-newuser/true/UA4374";

        const result = document.getElementById("result");

        document.getElementById("checkBtn").addEventListener("click", () => {

            const refreshToken =
                localStorage.getItem("refreshTokenId");

            const bearerToken =
                localStorage.getItem("tokenId");

            const validateToken =
                localStorage.getItem("userUid");

            result.textContent = JSON.stringify({
                endpoint: API_URL,
                method: "PATCH",
                body: {
                    rejectReason: null
                },
                tokensAvailable: {
                    refreshTokenId: !!refreshToken,
                    tokenId: !!bearerToken,
                    userUid: !!validateToken
                }
            }, null, 2);
        });
    </script>

</body>
</html>
